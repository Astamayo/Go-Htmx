name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: repuestosdirect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Unit tests
        working-directory: repuestosdirect
        run: go test ./... -v -count=1

      - name: Integration tests
        working-directory: repuestosdirect
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/repuestosdirect_test?sslmode=disable
        run: go test -tags=integration ./... -v -count=1

      - name: Build
        working-directory: repuestosdirect
        run: go build -o server .
