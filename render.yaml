services:
  - type: web
    name: repuestosdirect
    runtime: go
    rootDir: repuestosdirect
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: repuestosdirect-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: DRIVER_PASSWORD
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: DRIVER_PHONE
        sync: false
      - key: RENDER
        value: "true"

databases:
  - name: repuestosdirect-db
    plan: free
