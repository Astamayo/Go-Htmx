{{define "page_admin_login"}}{{template "header" .}}
<div class="max-w-sm mx-auto mt-10 bg-white border border-stone-200 rounded-lg p-6 shadow-sm">
  <h1 class="text-xl font-bold text-[#1B2A4A] mb-1">Administración</h1>
  <p class="text-sm text-stone-500 mb-5">Acceso exclusivo para administradores.</p>
  {{if .Error}}<div class="mb-4 text-sm bg-red-50 text-red-700 border border-red-200 rounded px-3 py-2">{{.Error}}</div>{{end}}
  <form method="POST" action="/admin/login" class="space-y-3">
    {{template "csrf" .}}
    <div>
      <label class="block text-xs font-semibold text-stone-500 mb-1">Usuario</label>
      <input type="text" name="username" required class="w-full border border-stone-300 rounded px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-stone-500 mb-1">Contraseña</label>
      <input type="password" name="password" required class="w-full border border-stone-300 rounded px-3 py-2 text-sm">
    </div>
    <button class="w-full bg-[#1B2A4A] text-white rounded py-2 text-sm font-semibold">Entrar</button>
  </form>
</div>
{{template "footer" .}}{{end}}
