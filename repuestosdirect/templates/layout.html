{{define "header"}}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · RepuestosDirect</title>
  <!-- DEMO ONLY: Tailwind + HTMX via CDN for fast iteration.
       Production build should compile Tailwind locally and self-host
       htmx.min.js (a few KB) so the site keeps working on slow 3G/4G
       and doesn't depend on external CDNs. See README.md. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    .htmx-indicator{opacity:0;transition:opacity .15s}
    .htmx-request .htmx-indicator{opacity:1}
  </style>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen">
  <header class="bg-[#1B2A4A] text-white">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-bold text-lg tracking-tight">Repuestos<span class="text-[#C99A5B]">Direct</span></a>
      <div class="flex items-center gap-4 text-sm">
        <a href="/catalogo" class="hover:text-[#C99A5B]">Catálogo</a>
        {{template "cart_badge" .CartCount}}
        {{if .Shop}}
          <a href="/dashboard" class="hover:text-[#C99A5B]">{{.Shop.Name}}</a>
          <a href="/logout" class="text-stone-300 hover:text-white">Salir</a>
        {{else}}
          <a href="/login" class="hover:text-[#C99A5B]">Entrar</a>
        {{end}}
      </div>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-6">
{{end}}
{{define "footer"}}
  </main>
  <footer class="max-w-5xl mx-auto px-4 py-8 text-xs text-stone-400">
    RepuestosDirect — demo de plataforma de pedidos (Go + HTMX, sin dependencias externas)
  </footer>
</body>
</html>
{{end}}
