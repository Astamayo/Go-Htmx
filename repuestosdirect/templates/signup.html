{{define "page_signup"}}{{template "header" .}}
<div class="max-w-sm mx-auto mt-10 bg-white border border-stone-200 rounded-lg p-6 shadow-sm">
  <h1 class="text-xl font-bold text-[#1B2A4A] mb-1">Crear cuenta de taller</h1>
  <p class="text-sm text-stone-500 mb-5">Empiezas con un límite de crédito inicial de $300.</p>

  {{if .Error}}
  <div class="mb-4 text-sm bg-red-50 text-red-700 border border-red-200 rounded px-3 py-2">{{.Error}}</div>
  {{end}}

  <form method="POST" action="/signup" class="space-y-3">
    <div>
      <label class="block text-xs font-semibold text-stone-500 mb-1">Nombre del taller</label>
      <input type="text" name="name" required class="w-full border border-stone-300 rounded px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-stone-500 mb-1">Nombre del dueño</label>
      <input type="text" name="owner" required class="w-full border border-stone-300 rounded px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-stone-500 mb-1">WhatsApp (con código de país)</label>
      <input type="text" name="phone" placeholder="+1 809-555-0100" required
        class="w-full border border-stone-300 rounded px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-stone-500 mb-1">Dirección del taller</label>
      <textarea name="address" required rows="2" class="w-full border border-stone-300 rounded px-3 py-2 text-sm"
        placeholder="Sector, Calle, Número..."></textarea>
    </div>
    <div>
      <label class="block text-xs font-semibold text-stone-500 mb-1">Contraseña</label>
      <input type="password" name="password" required class="w-full border border-stone-300 rounded px-3 py-2 text-sm">
    </div>
    <button class="w-full bg-[#1B2A4A] text-white rounded py-2 text-sm font-semibold hover:bg-[#243560]">
      Crear cuenta
    </button>
  </form>
  <p class="helper-link" style="text-align:center;font-size:12px;color:#5A5A5A;margin-top:14px;">
    ¿Ya tienes cuenta? <a href="/login" class="text-[#1B2A4A] underline font-semibold">Entrar</a>
  </p>
</div>
{{template "footer" .}}{{end}}
