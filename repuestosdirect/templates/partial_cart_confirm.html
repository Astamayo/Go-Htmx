{{define "partial_cart_confirm"}}
<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" id="cart-modal">
  <div class="bg-white rounded-lg p-5 max-w-sm w-full shadow-lg">
    <p class="font-semibold text-[#1B2A4A] mb-1">{{.Part.Name}}</p>
    <p class="text-sm text-stone-500 mb-4">Ya tienes {{.Qty}} en el carrito. ¿Aumentar cantidad?</p>
    <div class="flex gap-2">
      <form hx-post="/cart/add" hx-target="#cart-modal" hx-swap="outerHTML" class="flex-1">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <input type="hidden" name="part_id" value="{{.Part.ID}}">
        <input type="hidden" name="confirm" value="yes">
        <button class="w-full bg-[#1B2A4A] text-white py-2 rounded text-sm font-semibold">Sí, agregar otra</button>
      </form>
      <button onclick="document.getElementById('cart-modal')?.remove()" class="flex-1 border border-stone-300 py-2 rounded text-sm">Cancelar</button>
    </div>
  </div>
</div>
{{end}}

{{define "partial_cart_added"}}
<div id="cart-toast" class="fixed bottom-4 right-4 bg-emerald-700 text-white text-sm px-4 py-3 rounded-lg shadow-lg z-50">
  ✓ {{.Part.Name}} — cantidad: {{.Qty}}
</div>
<script>setTimeout(function(){ document.getElementById('cart-toast')?.remove(); document.getElementById('cart-modal')?.remove(); }, 2500);</script>
{{template "cart_badge" .CartCount}}
{{end}}
